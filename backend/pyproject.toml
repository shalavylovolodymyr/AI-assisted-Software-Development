[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-app"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "SQLAlchemy==2.0.40",
  "pydantic==2.11.3", "alembic==1.15.2", "psycopg[binary]==3.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "httpx==0.28.1", "ruff==0.11.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
