name: signal
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["signal-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://signal:signal@db:5432/signal
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: http://localhost:5178,http://127.0.0.1:5178
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5178:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  signal-data:
