name: SIGNAL CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: signal
          POSTGRES_DB: signal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signal -d signal_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://signal:signal@127.0.0.1:5432/signal_test
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.lock
      - run: npm ci
      - run: .venv/bin/ruff check backend scripts
      - run: .venv/bin/ruff format --check backend scripts
      - run: .venv/bin/python scripts/check-artifacts.py
      - name: Backend unit, PostgreSQL integration and API tests
        run: .venv/bin/pytest backend/tests --cov=signal_app.domain --cov=signal_app.application --cov-fail-under=90 --cov-report=xml --cov-report=term --junitxml=backend-results.xml
      - run: npm run lint --workspace frontend
      - run: npm run typecheck --workspace frontend
      - run: npm run test:frontend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-evidence
          path: |
            coverage.xml
            backend-results.xml
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:5178/api/v1/dashboard/summary
      - run: curl --fail http://127.0.0.1:5178/
      - run: docker compose logs
        if: always()
      - run: docker compose down --volumes
        if: always()
