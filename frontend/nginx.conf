server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://api:8000; }
    location /api-docs { return 302 http://127.0.0.1:8000/docs; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
